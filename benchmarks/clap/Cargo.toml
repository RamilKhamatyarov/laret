[package]
name = "bench-clap"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "bench-clap"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "signal"] }

[profile.release]
# Comparable to the Cobra target's -trimpath -ldflags="-s -w": optimised, no
# debug info. Nothing here changes the concurrency runtime being measured.
strip = true
