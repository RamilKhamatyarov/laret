# Action runtime policy: every pinned action here must run on Node 20 or newer.
# Node 16 runners are gone and Node 20 is being retired, so actions/cache is held
# at v4 or later and the actions/* checkout, setup and artifact actions at their
# current majors. Audit the pins with:
#   grep -rhoE 'uses: [^@]+@v[0-9]+' .github/workflows/ | sort -u
name: Qodana
on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

jobs:
  qodana:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      checks: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: 'Qodana Scan'
        uses: JetBrains/qodana-action@v2025.2
        env:
          QODANA_TOKEN: ${{ secrets.QODANA_TOKEN }}
        with:
          pr-mode: false
          use-caches: true
          post-pr-comment: true
          use-annotations: true
          upload-result: false
          push-fixes: 'none'
